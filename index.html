<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <script>
      try {
        var savedTheme = localStorage.getItem('wotfit-theme')
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme
          var themeColor = document.querySelector('meta[name="theme-color"]')
          if (themeColor) {
            themeColor.setAttribute(
              'content',
              savedTheme === 'light' ? '#fafafa' : '#09090b',
            )
          }
        }
      } catch (error) {
        void error
      }
    </script>
    <meta name="description" content="Log gym sessions, track sets, time your rest and progress every week. Works offline and installs like a native app." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WOTFit" />
    <title>WOTFit by Ken Kanfix — Workout Tracker</title>
    <script type="module" crossorigin src="/wotfit/assets/index-BSmFl8Cz.js"></script>
    <link rel="stylesheet" crossorigin href="/wotfit/assets/index-vAGqVoyS.css">
  <link rel="manifest" href="/wotfit/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/wotfit/registerSW.js"></script></head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (event) {
        console.error(event.error || event.message)
      })
      window.addEventListener('unhandledrejection', function (event) {
        console.error(event.reason)
      })
    </script>
  </body>
</html>
