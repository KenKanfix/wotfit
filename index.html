<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta
      name="description"
      content="WOTFit is an offline-first workout tracker by Ken Kanfix."
    />
    <title>WOTFit</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #09090b;
        --card: #18181b;
        --border: #27272a;
        --text: #fafafa;
        --muted: #a1a1aa;
        --brand: #a3e635;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 2rem;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: min(100%, 34rem);
        padding: 2rem;
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        background: var(--card);
      }

      .logo {
        width: 4rem;
        height: 4rem;
        border: 1px solid var(--border);
        border-radius: 1.1rem;
      }

      .eyebrow {
        margin: 1.25rem 0 0;
        color: var(--brand);
        font-size: 0.625rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0.2rem 0 0;
        font-size: 2.5rem;
        letter-spacing: -0.04em;
        line-height: 1.1;
      }

      p {
        margin: 0.75rem 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }

      a {
        color: var(--brand);
        font-weight: 600;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .button {
        display: inline-block;
        padding: 0.7rem 1rem;
        border-radius: 0.75rem;
        background: var(--brand);
        color: #09090b;
      }

      .button:hover {
        text-decoration: none;
      }

      footer {
        margin-top: 1.75rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--border);
        color: #71717a;
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="logo" viewBox="0 0 48 48" role="img" aria-label="WOTFit">
        <rect width="48" height="48" rx="12" fill="#a3e635" />
        <rect x="7" y="16" width="7" height="16" rx="2.5" fill="#09090b" />
        <rect x="34" y="16" width="7" height="16" rx="2.5" fill="#09090b" />
        <rect x="15" y="21" width="18" height="6" rx="3" fill="#09090b" />
      </svg>
      <p class="eyebrow">WOTFit by Ken Kanfix</p>
      <h1>Train on purpose.</h1>
      <p>
        An offline-first workout tracker for strength, muscle, fat loss,
        endurance, and calisthenics.
      </p>
      <div class="links">
        <a class="button" href="privacy.html">Privacy Policy</a>
        <a href="mailto:kenkanfix@gmail.com">Contact</a>
      </div>
      <footer>WOTFit by Ken Kanfix</footer>
    </main>
  </body>
</html>
